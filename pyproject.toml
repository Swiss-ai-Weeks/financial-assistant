[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "financial-assistant"
version = "0.1.0"
description = "Evidence-backed news attribution for portfolio anomalies"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3",
  "trafilatura>=2.2,<3",
  "numpy>=2,<3",
  "pandas>=2.2,<3",
  "statsmodels>=0.14,<1",
  "yfinance>=1.7,<2",
  "requests>=2.31,<3",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "httpx>=0.27,<1",
]
# The temporal graph network over the news graph (scripts/wire.py).
# The GPU box has torch through vLLM; torch_geometric is pure Python.
tgn = [
  "torch>=2.2",
  "torch_geometric>=2.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/financial_assistant"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]
