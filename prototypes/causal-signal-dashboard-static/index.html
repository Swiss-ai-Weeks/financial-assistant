.form-range {

  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(

  height: 28px;

  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);

  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {

  outline-offset: 2px;
}

svg {

  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

            [&#x27;Contradictory supplier&#x27;, 68, &#x27;brake&#x27;, 2],
            [&#x27;Unquantified materiality&#x27;, 77, &#x27;brake&#x27;, 0],
            [&#x27;Persistent volume&#x27;, 54, &#x27;accelerator&#x27;, 1]
          ],
          contextSources: [
            { id: &#x27;M1&#x27;, time: &#x27;Live&#x27;, source: &#x27;Normalized market feed&#x27;, role: &#x27;Market&#x27;, lineage: &#x27;MKT-CRN&#x27;, stance: &#x27;Context&#x27; },
            { id: &#x27;H1&#x27;, time: &#x27;Prior 90d&#x27;, source: &#x27;Historical event baseline&#x27;, role: &#x27;Model input&#x27;, lineage: &#x27;HIST-CRN&#x27;, stance: &#x27;Context&#x27; }
          ],
          expiries: [&#x27;Not active&#x27;, &#x27;Not active&#x27;, &#x27;Not active&#x27;, &#x27;Not active&#x27;, &#x27;Not active&#x27;],
          horizons: [&#x27;—&#x27;, &#x27;—&#x27;, &#x27;—&#x27;, &#x27;—&#x27;, &#x27;Until resolved&#x27;],
          benchmark: &#x27;components basket&#x27;
        }
      };

      const scenarioControl = root.querySelector(&#x27;#sa-scenario&#x27;);
      const horizonControl = root.querySelector(&#x27;#sa-horizon&#x27;);
      const eventGroups = x.map((_, index) =&gt; root.querySelector(`#sa-event-${index}`));

      function yValues(values) {
        const max = Math.max(6.5, ...values.map((value) =&gt; Math.abs(value)));
        return values.map((value) =&gt; 82 - (value / max) * 58);
      }

      function marker(group, type, cx, cy) {
        const stem = group.querySelector(&#x27;line&#x27;);
        const label = group.querySelector(&#x27;text&#x27;);
        group.innerHTML = &#x27;&#x27;;
        group.appendChild(stem);

        let shape;
        if (type === &#x27;primary&#x27;) {
          shape = document.createElementNS(&#x27;http://www.w3.org/2000/svg&#x27;, &#x27;rect&#x27;);
          shape.setAttribute(&#x27;x&#x27;, cx - 5);
          shape.setAttribute(&#x27;y&#x27;, cy - 5);
          shape.setAttribute(&#x27;width&#x27;, 10);
          shape.setAttribute(&#x27;height&#x27;, 10);
          shape.setAttribute(&#x27;transform&#x27;, `rotate(45 ${cx} ${cy})`);
        } else if (type === &#x27;contradiction&#x27;) {
          shape = document.createElementNS(&#x27;http://www.w3.org/2000/svg&#x27;, &#x27;path&#x27;);
          shape.setAttribute(&#x27;d&#x27;, `M ${cx} ${cy - 6} L ${cx + 6} ${cy + 5} L ${cx - 6} ${cy + 5} Z`);
        } else if (type === &#x27;derivative&#x27;) {
          shape = document.createElementNS(&#x27;http://www.w3.org/2000/svg&#x27;, &#x27;rect&#x27;);
          shape.setAttribute(&#x27;x&#x27;, cx - 5);
          shape.setAttribute(&#x27;y&#x27;, cy - 5);
          shape.setAttribute(&#x27;width&#x27;, 10);
          shape.setAttribute(&#x27;height&#x27;, 10);
        } else {
          shape = document.createElementNS(&#x27;http://www.w3.org/2000/svg&#x27;, &#x27;circle&#x27;);
          shape.setAttribute(&#x27;cx&#x27;, cx);
          shape.setAttribute(&#x27;cy&#x27;, cy);
          shape.setAttribute(&#x27;r&#x27;, 5);
        }
        shape.setAttribute(&#x27;class&#x27;, `sa-${type}`);
        group.appendChild(shape);
        group.appendChild(label);
      }

      function renderCriteria(scenario, step) {
        const body = root.querySelector(&#x27;#sa-criteria-body&#x27;);
        const visibleIds = new Set([
          ...scenario.events.slice(0, step + 1).map((event) =&gt; event.id),
          ...scenario.contextSources.map((source) =&gt; source.id)
        ]);
        body.innerHTML = &#x27;&#x27;;
        scenario.criteria.forEach(([label, values, evidence]) =&gt; {
          const value = values[step];
          const row = document.createElement(&#x27;tr&#x27;);
          const nameCell = document.createElement(&#x27;td&#x27;);
          const scoreCell = document.createElement(&#x27;td&#x27;);
          const evidenceCell = document.createElement(&#x27;td&#x27;);
          const track = document.createElement(&#x27;span&#x27;);
          const fill = document.createElement(&#x27;span&#x27;);
          nameCell.textContent = label;
          scoreCell.className = &#x27;text-end&#x27;;
          scoreCell.textContent = `${value}`;
          track.className = &#x27;sa-score-track&#x27;;
          track.style.display = &#x27;inline-block&#x27;;
          track.style.marginLeft = &#x27;8px&#x27;;
          fill.className = label === &#x27;Contradictory evidence&#x27; ? &#x27;sa-score-fill sa-score-brake&#x27; : &#x27;sa-score-fill&#x27;;
          fill.style.width = `${value}%`;
          track.appendChild(fill);
          scoreCell.appendChild(track);
          const availableEvidence = evidence
            .split(&#x27;,&#x27;)
            .map((id) =&gt; id.trim())
            .filter((id) =&gt; id &amp;&amp; visibleIds.has(id));
          evidenceCell.textContent = availableEvidence.length ? availableEvidence.join(&#x27;, &#x27;) : &#x27;—&#x27;;
          evidenceCell.className = &#x27;sa-evidence-id&#x27;;
          row.append(nameCell, scoreCell, evidenceCell);
          body.appendChild(row);
        });
      }

      function renderSources(scenario, step) {
        const visibleNews = scenario.events.slice(0, step + 1);
        const visible = [...visibleNews, ...scenario.contextSources];
        const originalNews = visibleNews.filter((event) =&gt; ![&#x27;Derivative&#x27;, &#x27;Market&#x27;].includes(event.role));
        const uniqueLineages = new Set(originalNews.map((event) =&gt; event.lineage)).size;
        const cutoffNote = step &lt; scenario.events.length - 1 ? &#x27;later evidence hidden by the as-of cutoff&#x27; : &#x27;complete at the selected cutoff&#x27;;
        root.querySelector(&#x27;#sa-source-summary&#x27;).textContent = `${visible.length} evidence records · ${uniqueLineages} news lineages · ${cutoffNote}`;
        const body = root.querySelector(&#x27;#sa-source-body&#x27;);
        body.innerHTML = &#x27;&#x27;;
        visible.forEach((event) =&gt; {
          const row = document.createElement(&#x27;tr&#x27;);
          [event.id, event.time, event.source, event.role, event.lineage, event.stance].forEach((value, index) =&gt; {
            const cell = document.createElement(&#x27;td&#x27;);
            cell.textContent = value;
            if (index === 0 || index === 4) cell.className = &#x27;sa-evidence-id&#x27;;
            row.appendChild(cell);
          });
          body.appendChild(row);
        });
      }

      function renderForces(scenario, step) {
        const container = root.querySelector(&#x27;#sa-forces&#x27;);
        container.innerHTML = &#x27;&#x27;;
        scenario.forces
          .filter(([, , , minimumStep]) =&gt; step &gt;= minimumStep)
          .forEach(([label, value, kind]) =&gt; {
            const row = document.createElement(&#x27;div&#x27;);
            const copy = document.createElement(&#x27;span&#x27;);
            const track = document.createElement(&#x27;span&#x27;);
            const fill = document.createElement(&#x27;span&#x27;);
            row.className = &#x27;sa-force&#x27;;
            row.dataset.kind = kind === &#x27;brake&#x27; ? &#x27;brake&#x27; : &#x27;accelerator&#x27;;
            copy.textContent = `${kind === &#x27;brake&#x27; ? &#x27;−&#x27; : &#x27;+&#x27;} ${label}`;
            track.className = &#x27;sa-force-bar&#x27;;
            fill.className = &#x27;sa-force-fill&#x27;;
            fill.style.width = `${value}%`;
            track.appendChild(fill);
            row.append(copy, track);
            container.appendChild(row);
          });
      }

      function renderPath(nodes) {
        const container = root.querySelector(&#x27;#sa-path&#x27;);
        container.innerHTML = &#x27;&#x27;;
        nodes.forEach((node, index) =&gt; {
          const label = document.createElement(&#x27;span&#x27;);
          label.className = &#x27;sa-path-node&#x27;;
          label.textContent = node;
          container.appendChild(label);
          if (index &lt; nodes.length - 1) {
            const arrow = document.createElement(&#x27;span&#x27;);
            arrow.className = &#x27;sa-path-arrow&#x27;;
            arrow.setAttribute(&#x27;aria-hidden&#x27;, &#x27;true&#x27;);
            arrow.textContent = &#x27;→&#x27;;
            container.appendChild(arrow);
          }
        });
      }

      function render() {
        const scenario = scenarios[scenarioControl.value];
        const step = Number(horizonControl.value);
        const ys = yValues(scenario.prices);
        const probability = scenario.continuation[step];
        const radius = 9 + probability * 0.18;
        const ballY = slopeY[step] - radius + 1;

        root.querySelector(&#x27;#sa-ticker&#x27;).textContent = scenario.ticker;
        root.querySelector(&#x27;#sa-company&#x27;).textContent = scenario.company;
        root.querySelector(&#x27;#sa-state&#x27;).textContent = scenario.state[step];
        root.querySelector(&#x27;#sa-time&#x27;).textContent = scenario.times[step];

        const signal = root.querySelector(&#x27;#sa-signal&#x27;);
        signal.textContent = scenario.signals[step];
        signal.dataset.direction = scenario.directions[step];
        root.querySelector(&#x27;#sa-signal-note&#x27;).textContent = scenario.signalNotes[step];
        root.querySelector(&#x27;#sa-causal&#x27;).textContent = `${scenario.causal[step]} / 100`;
        root.querySelector(&#x27;#sa-causal-note&#x27;).textContent = scenario.causalNotes[step];
        root.querySelector(&#x27;#sa-continuation&#x27;).textContent = `${probability}%`;
        root.querySelector(&#x27;#sa-continuation-note&#x27;).textContent = scenario.continuationNotes[step];

        const path = x.slice(0, step + 1).map((value, index) =&gt; `${index === 0 ? &#x27;M&#x27; : &#x27;L&#x27;} ${value} ${ys[index]}`).join(&#x27; &#x27;);
        root.querySelector(&#x27;#sa-price-path&#x27;).setAttribute(&#x27;d&#x27;, path);
        root.querySelector(&#x27;#sa-price-dot&#x27;).setAttribute(&#x27;cx&#x27;, x[step]);
        root.querySelector(&#x27;#sa-price-dot&#x27;).setAttribute(&#x27;cy&#x27;, ys[step]);
        root.querySelector(&#x27;#sa-price-value&#x27;).setAttribute(&#x27;x&#x27;, x[step]);
        root.querySelector(&#x27;#sa-price-value&#x27;).setAttribute(&#x27;y&#x27;, Math.max(14, ys[step] - 9));
        root.querySelector(&#x27;#sa-price-value&#x27;).textContent = scenario.moves[step];

        const ball = root.querySelector(&#x27;#sa-ball&#x27;);
        const ring = root.querySelector(&#x27;#sa-ball-ring&#x27;);
        ball.setAttribute(&#x27;cx&#x27;, x[step]);
        ball.setAttribute(&#x27;cy&#x27;, ballY);
        ball.setAttribute(&#x27;r&#x27;, radius);
        ring.setAttribute(&#x27;cx&#x27;, x[step]);
        ring.setAttribute(&#x27;cy&#x27;, ballY);
        ring.setAttribute(&#x27;r&#x27;, radius + 4);
        root.querySelector(&#x27;#sa-ball-label&#x27;).setAttribute(&#x27;x&#x27;, x[step]);
        root.querySelector(&#x27;#sa-ball-label&#x27;).setAttribute(&#x27;y&#x27;, ballY + 4);
        root.querySelector(&#x27;#sa-ball-label&#x27;).textContent = `${probability}%`;

        eventGroups.forEach((group, index) =&gt; {
          marker(group, scenario.events[index].type, x[index], slopeY[index]);
          group.classList.toggle(&#x27;sa-future&#x27;, index &gt; step);
          group.classList.toggle(&#x27;sa-current&#x27;, index === step);
          group.querySelector(&#x27;text&#x27;).textContent = scenario.events[index].time;
        });

        root.querySelector(&#x27;#sa-event-detail&#x27;).textContent = scenario.events[step].detail;
        root.querySelector(&#x27;#sa-confidence-badge&#x27;).textContent = scenario.confidence[step];
        root.querySelector(&#x27;#sa-decision-copy&#x27;).textContent = scenario.decision[step];
        root.querySelector(&#x27;#sa-invalidation&#x27;).textContent = scenario.invalidation[step];
        root.querySelector(&#x27;#sa-horizon-copy&#x27;).innerHTML = `&lt;span class=&quot;text-muted&quot;&gt;Horizon:&lt;/span&gt; ${scenario.horizons[step]}`;
        root.querySelector(&#x27;#sa-expiry&#x27;).innerHTML = `&lt;span class=&quot;text-muted&quot;&gt;Expires:&lt;/span&gt; ${scenario.expiries[step]}`;
        root.querySelector(&#x27;#sa-benchmark&#x27;).innerHTML = `&lt;span class=&quot;text-muted&quot;&gt;Benchmark:&lt;/span&gt; ${scenario.benchmark}`;

        renderPath(scenario.paths[step]);
        renderForces(scenario, step);
        renderCriteria(scenario, step);
        renderSources(scenario, step);
      }

      scenarioControl.addEventListener(&#x27;change&#x27;, () =&gt; {
        horizonControl.value = &#x27;4&#x27;;
        render();
      });
      horizonControl.addEventListener(&#x27;input&#x27;, render);

      root.querySelector(&#x27;#sa-challenge&#x27;).addEventListener(&#x27;click&#x27;, async () =&gt; {
        const scenario = scenarios[scenarioControl.value];
        const step = Number(horizonControl.value);
        if (window.openai &amp;&amp; typeof window.openai.sendFollowUpMessage === &#x27;function&#x27;) {
          await window.openai.sendFollowUpMessage({
            title: &#x27;Challenge the selected signal&#x27;,
            prompt: `Act as a skeptical event-driven analyst. Challenge this fictional research signal and identify the strongest counter-case, missing evidence, and invalidation test. Instrument: ${scenario.ticker}. As of: ${scenario.times[step]}. Signal: ${scenario.signals[step]}. Causal confidence: ${scenario.causal[step]}/100. Continuation probability: ${scenario.continuation[step]}%. Thesis: ${scenario.decision[step]}`
          });
        }
      });

      render();
    })();
  &lt;/script&gt;
&lt;/div&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
&lt;script id=&quot;codex-visualization-lucide&quot; async src=&quot;https://unpkg.com/lucide@1.17.0/dist/umd/lucide.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  const initialize = () =&gt; {
    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
  };
  if (globalThis.lucide != null) {
    initialize();
    return;
  }
  document
    .getElementById(&quot;codex-visualization-lucide&quot;)
    ?.addEventListener(&quot;load&quot;, initialize, { once: true });
})();
&lt;/script&gt;
